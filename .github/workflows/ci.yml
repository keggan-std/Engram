name: CI

on:
  push:
    # The review line and its per-domain branches are included deliberately.
    # With `main` alone, every gate in this file — the capability surface and
    # now the golden-fixture migration test — would sit idle for the entire
    # Foundations Review and only fire at merge, which is the one moment a
    # failure is most expensive and least expected.
    branches: [main, develop, v2-foundations, "fr/**"]
  pull_request:
    branches: [main, develop, v2-foundations]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # NOTE — this job is no longer the only place these gates run, and must not
  # become so again. `main` and this branch carried different workflows for 69
  # commits, so every gate below existed only where it was never needed. The two
  # generator --check gates now also run inside `npm test`
  # (tests/process/ci-parity.test.ts), which BOTH workflows invoke, so deleting
  # this job cannot silence them. That test also fails if a `run:` step is added
  # here without being mirrored or classified. See ENGRAM-MASTER-PLAN.md §2.3.
  surface:
    name: Capability surface
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Regenerates docs/CAPABILITY-SURFACE.md from the Zod schemas and fails if
      # it differs from what is committed. This is what makes a removed action, a
      # dropped enum or a loosened bound block the merge instead of shipping
      # unnoticed — the failure mode that cost this project ten features.
      - name: Check capability surface is up to date
        run: node scripts/generate-capability-surface.mjs --check

      # The other half of the contract. CAPABILITY-SURFACE.md gates the MCP tool
      # surface; this gates the HTTP API the dashboard consumes. Without it, a
      # response-envelope change in FR-D6 breaks packages/engram-dashboard and
      # nothing reports it until someone opens the dashboard.
      - name: Check HTTP surface is up to date
        run: node scripts/generate-http-surface.mjs --check

      # Dead-code detection. knip.json is scoped to src/; packages/* are separate
      # build entry points and would drown the signal.
      - name: Check for dead code
        run: npx -y knip@5 --no-progress
